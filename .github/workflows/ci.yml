name: 规则与模型接入

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.75.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust 规则与协议测试
        run: cargo test --locked --workspace --all-targets
      - name: 构建命令行
        run: cargo build --locked -p splendor-cli
      - name: 安装 Python 接口
        run: python -m pip install -e .
      - name: Python 环境与跨语言接入
        run: python -m unittest discover -s python/tests -v
