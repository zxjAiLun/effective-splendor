[package]
name = "splendor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Splendor self-play, replay record/verify, and benchmarks"

[[bin]]
name = "splendor"
path = "src/main.rs"

[dependencies]
splendor-core = { workspace = true }
splendor-protocol = { workspace = true }
splendor-replay = { workspace = true }
splendor-arena = { workspace = true }
splendor-agent = { workspace = true }
splendor-eval = { workspace = true }
splendor-search = { workspace = true }
splendor-imperfect-search = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Test-only: hashes the frozen M06 benchmark corpus and the published search
# analysis artifacts. Deliberately not a production dependency.
sha2 = { workspace = true }
